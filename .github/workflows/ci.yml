name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: cs-demo-cloud:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          app="$RUNNER_TEMP/app"
          mkdir -p "$app"
          mounts="-v $app/data:/data -v $app/db:/db"
          docker run -d --name web -p 3000:3000 $mounts cs-demo-cloud:test
          for _ in $(seq 30); do curl -fs localhost:3000/healthz >/dev/null && break; sleep 1; done
          docker logs web
          test "$(curl -fs localhost:3000/healthz)" = ok
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/)" = 303
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/login)" = 200
          docker logs web 2>&1 | grep -q '/invite/'
          test "$(stat -c %u "$app/data")" = 1000
          test -f "$app/db/app.db"
          docker run -d --name worker $mounts cs-demo-cloud:test node apps/worker/src/index.ts
          for _ in $(seq 15); do docker logs worker 2>&1 | grep -q 'Worker ready' && break; sleep 1; done
          docker logs worker
          docker logs worker 2>&1 | grep -q 'Worker ready'
          docker run -d --name fetcher $mounts cs-demo-cloud:test node apps/worker/src/fetcher.ts
          for _ in $(seq 15); do docker logs fetcher 2>&1 | grep -q 'Valve fetcher ready' && break; sleep 1; done
          docker logs fetcher
          docker logs fetcher 2>&1 | grep -q 'Valve fetcher ready'
          test "$(docker exec web stat -c %u /proc/1)" = 1000

      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
