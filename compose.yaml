x-app: &app
  image: ghcr.io/shakerrdev/cs-demo-cloud:latest
  restart: unless-stopped
  environment:
    ORIGIN: ${ORIGIN:-}
    PUID: ${PUID:-1000}
    PGID: ${PGID:-1000}
  volumes:
    - ${DATA_PATH:-./data}:/data
    - ${DB_PATH:-./db}:/db

services:
  web:
    <<: *app
    ports:
      - ${BIND:-0.0.0.0}:${PORT:-3000}:3000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s

  worker:
    <<: *app
    command: ['node', 'apps/worker/src/index.ts']
    depends_on:
      web:
        condition: service_healthy

  fetcher:
    <<: *app
    command: ['node', 'apps/worker/src/fetcher.ts']
    depends_on:
      web:
        condition: service_healthy
